o igual que 3h. Dos rodillos superiores separados L/3. Momento constante en tercio central. 1.3.2 Carga centrada P: para h menor que 150 mm y L mayor o igual que 2h. Un rodillo central. 1.3.3 Los métodos NO son alternativos ni comparables. No correlacionar.",simple:`Hay dos formas de cargar, y se eligen por la altura h de la viguita:
• Si tu probeta es alta (h mayor o igual que 150 mm) usas dos cargas arriba separadas en tercios. Todo el medio queda con el mismo momento, así que va a fallar por el punto más débil del medio.
• Si es chiquita (h menor que 150 mm) usas una sola carga al medio. El momento máximo es solo puntual al centro.
Por eso no puedes comparar un resultado con el otro: la de carga central suele dar 5-10% más alta porque es más difícil que justo el punto débil caiga bajo la carga puntual.`},{kind:"block",techTitle:"1.3 Referencias que revisa el auditor",tech:"NCh1017 confección y curado — sin curado R baja 10-20%. NCh1172 refrentado cuando desnivel >0,4 mm. NCh2598/1 calibración prensa ≤12 meses.",simple:"Si la probeta no se curó bien (se secó antes), va a dar menos resistencia, no por el hormigón sino porque hiciste mal el curado. Si la cara está muy chueca (más de 0,4 mm) tienes que refrentar. Y la prensa tiene que tener su certificado vigente, no de hace 3 años."}],2:[{kind:"kpi",data:[{k:"Sensibilidad",v:"≤1% Pmax"},{k:"Exactitud",v:"±1%"},{k:"Rango",v:"10-90%"},{k:"Vel.",v:"0,86-1,21 MPa/min"}]},{kind:"block",techTitle:"2.1 Prensa — requisito 4.1",tech:"Rígida, sin alterar distribución carga. Sensibilidad ≤1% Pmax esperada. Exactitud ±1% en intervalo utilizable 10-90% según certificado NCh2598/1 ≤12 meses. Capacidad típica 100-300 kN. Debe permitir regulación fina para lograr 0,86 a 1,21 MPa/min (razón de tensión). Retorno a cero sin juego en rótula.",simple:"Si tu prensa llega hasta 10000 kgf, la división más chica que muestra tiene que ser menor o igual que 100 kgf (1% de 10000). Si marca de 500 en 500, no sirve, es muy gruesa. Además no puedes usar una prensa gigante de 3000 kN para romper una probetita de 30 kN porque estarías abajo del 10% y mide pésimo. Tiene que tener su papel de calibración al día y dejarte regular la velocidad finita."},{kind:"block",techTitle:"2.2 Dispositivo flexión — corazón 4.2",tech:"Elementos de contacto superficie cilíndrica → contacto rectilíneo. Cargas y reacciones verticales, líneas paralelas y ⊥ L. Fijación de L con topes ±1 mm. Rodillo longitud ≥ b (ej. b=150 → rodillo ≥160 mm). Diámetro 25-40 mm. Al menos una rótula inferior y una superior deben poder girar e inclinarse ligeramente.",simple:"Donde la viguita toca la máquina no puede ser una plancha plana, tiene que ser un rodillo redondo, así el contacto es una línea y no un punto. Si pones planchas planas, concentras toda la fuerza en un punto y la rompes antes, baja 15-30%. La rótula es como una bisagra que se acomoda sola si la probeta está un poquito chueca, para que no le metas torsión. Si no tiene rótula, estás torciendo la probeta sin querer."},{kind:"block",techTitle:"2.3 Instrumentos 4.3-4.5",tech:"4.3 Regla rectificada acero ≥500 mm verifica rectitud — no debe pasar luz. 4.4 Pie metro / huincha resolución 1 mm para ℓ, b, h, L, a. 4.5 Balanza ≥35 kg, precisión ≥0,1% masada ≈0,02 kg. Ej: 26 kg → 0,026 kg requerida. Todo contrastado con patrón trazable ISO 17025.",simple:"No vale cualquier huincha de obra. Necesitas una regla de acero larga y realmente recta para ver si la cara está chueca. Para medir ancho y alto necesitas un pie de metro que mida de milímetro en milímetro. Y para pesar, una balanza que detecte hasta 20 gramos. Si pesas 26 kg, tiene que notar 20 g de diferencia. Y todo con certificado, el auditor te va a pedir el papel."}],3:[{kind:"kpi",data:[{k:"Masa",v:"±0,02 kg"},{k:"Largo",v:"±1 mm"},{k:"Precarga",v:"3-6% Pest"},{k:"Contacto",v:"≤0,1 mm OK"}]},{kind:"block",techTitle:"3.1 Acondicionamiento 5.1",tech:"Retirar del curado → proteger con arpillera húmeda → ensayar inmediato tras retirar protección. Evitar secado cara inferior traccionada. Refrentado ≤3 h antes del ensayo.",simple:"Sacas la probeta de la cámara húmeda y la tapas con un trapo mojado. La ensayas al tiro, no la dejes secar. Sobre todo la cara de abajo, que es la que va a traccionarse y romperse. Si esa cara se seca, se contrae y se microfisura sola, y te va a dar hasta 25% menos sin que el hormigón sea malo. Es error de procedimiento."},{kind:"lh-explainer"},{kind:"block",techTitle:"3.3 Trazado y mediciones 5.3-5.6",tech:"5.3 Trazar rectas finas indelebles en 4 caras mayores marcando apoyos y cargas. No tallar. 5.4 Verificar rectitud con regla ≥500 mm — criterio no pasa luz. 5.5 Masa M kg ±0,02 kg justo antes. 5.6 Largo ℓ eje horizontal punto medio caras laterales Fig.3c ±1 mm, promedio ambas caras.",simple:"Le dibujas con lápiz fino donde van los apoyos abajo y las cargas arriba, en las 4 caras largas. No lo rayes profundo, solo marca. Después pasas la regla de acero: si no ves luz por debajo, está recta. Pesas la probeta antes de marcarla, para no perder agua al manipular. Y mides el largo por el costado, no por arriba, en el medio de la cara lateral."},{kind:"block",techTitle:"3.4 Colocación y contacto 5.7-5.9",tech:"Técnico: Limpiar superficies. Colocar con cara de llenado en plano vertical. Coincidir trazado. Contacto total desviación ≤0,1 mm = aceptable directo. Si 0,1-0,4 mm → láminas cuero/sintético espesor ≥5 mm, ancho ≥25 mm, largo ≥ b, nuevas. Si >0,4 mm → refrentar NCh1172. No yeso.",simple:"Apoyas la regla rectificada sobre la cara. Si no pasa luz o pasa menos que el grosor de una hoja (0,1 mm), está buena directo. Si pasa luz de 0,1 a 0,4 mm (como 1 a 4 hojas de papel), le pones una tirita de cuero blando de al menos 5 mm de grosor, más ancha que 25 mm y tan larga como el ancho de la probeta. Esa goma se deforma y compensa. Si pasa más que 0,4 mm (como el grosor de una tarjeta), está muy chueca: hay que refrentar, pasar por máquina que la deja plana."},{kind:"block",techTitle:"3.5 Precarga y rotura 5.10-5.13",tech:"5.10 Precarga 3-6% Pest para verificar contactos 5.8 y distancias ±1 mm. 5.11 Retirar manos. 5.12 Carga continua sin choques a razón uniforme tal que velocidad aumento tensión fibra extrema 0,86-1,21 MPa/min hasta rotura. 5.13 Registrar Pmax N/kN, medir b y h en sección rotura 3 puntos ±1 mm promedio.",simple:"Antes de ensayar de verdad, le das un apretoncito de 3 a 6% de lo que crees que va a aguantar, solo para ver que esté bien apoyada y que las distancias no se movieron. Como cuando acomodas una mesa coja. Luego aprietas de forma pareja y continua. Tienes que cargar ni muy rápido ni muy lento, como 1 MPa por minuto. Si tu probeta resiste 4 MPa, debe romperse entre 2 y 5 minutos aprox. Si se rompe en 10 segundos, ibas muy rápido. Si se demora 20 min, muy lento. Anotas la carga máxima y después mides el ancho y alto justo donde se rompió, en 3 puntos."}],4:[{kind:"kpi",data:[{k:"Fórmula tercio",v:"R=PL/bh²"},{k:"Fuera tercio",v:"R=3Pa/bh²"},{k:"Centrada",v:"R=3PL/2bh²"},{k:"Aprox",v:"0,05 MPa"}]},{kind:"block",techTitle:"4.1 Fractura en tercio central 6.1.1",tech:"R = P × L / (b × h²) [MPa = N/mm²] P carga máxima N, L luz apoyos mm, b ancho promedio rotura mm, h altura promedio rotura mm. Aproximar a 0,05 MPa.",simple:"Esta es la fórmula buena, cuando se rompe en el medio. Multiplicas la fuerza P por la distancia entre apoyos L, y lo divides por el ancho por alto al cuadrado. El alto al cuadrado manda mucho: si mides mal el alto, te cambia harto el resultado. Ejemplo: P=30.000 N (30 kN), L=450, b=150, h=150 → R=4,0 MPa. Si tu prensa estaba en kgf, convierte: kgf ×9,80665 = N. Si no conviertes, te da 10 veces menos."},{kind:"block",techTitle:"4.2 Fuera del tercio pero válida 6.1.2 y descarte 6.1.3",tech:"Si rotura fuera tercio central pero ≤0,05L de línea carga → R = 3×P×a / (b×h²) donde a = distancia rotura-apoyo más próximo cara inferior mm. Tolerancia = 0,05×L. Si >0,05L → desechar según 6.1.3, no promediar.",simple:"A veces se rompe un poco fuera del tercio medio, pero cerquita de donde aplicaste la carga. Si está a menos de 5% de L (ej. L=450 → 0,05L=22,5 mm, menos que el ancho de tu dedo), todavía vale pero usas otra fórmula que usa a, la distancia de la fisura al apoyo más cercano. Si está más lejos que eso, ya no vale, la botas, no la promedias. Ej: si tu línea de carga está a 150 mm y se rompe a 160 mm (10 mm fuera), vale con nota. Si se rompe a 200 mm (50 mm fuera), se desecha."},{kind:"block",techTitle:"4.3 Carga centrada 6.2 y densidad 6.3",tech:"Centrada: R = 3×P×L / (2×b×h²) ≈0,05 MPa. Densidad: V = b×h×ℓ mm³, V m³ = V/1e9, ρ = M / V kg/m³ aprox 10 kg/m³. b,h promedio rotura, ℓ largo promedio caras laterales, M masa ±0,02 kg.",simple:"Cuando la probeta es chica (100 mm) y usas una sola carga al medio, la fórmula lleva un 3/2. Para densidad, es masa dividido volumen. Pero ojo: volumen en mm³ dividido por mil millones para pasar a m³. Si divides 26 kg / 11.250.000 mm³ directo te da un número ridículo. Tienes que dividir por 0,01125 m³. Y redondeas a 10 kg/m³: 2347 → 2350."},{kind:"master"}],5:[{kind:"kpi",data:[{k:"Items informe",v:"12 (a-l)"},{k:"Clave auditoría",v:"e + j"},{k:"Ref",v:"NCh1038:09"},{k:"Validez",v:"3 estados"}]},{kind:"block",techTitle:"5.1 Informe 7.2 — los 12 ítems a-l que revisa el auditor",tech:"a) fecha/edad, b) densidad M/V, c) b promedio rotura, d) h promedio rotura, e) defectos exteriores + refrentado NCh1172 o láminas cuero tipo/espesor/estado — crítico, f) L, g) curado, h) Pmax N/kN con unidad y conversión, i) R MPa fórmula usada aprox 0,05, j) observaciones post-rotura oquedades/porosidad/adherencia/segregación/rotura defectuosa — crítico, k) desviaciones, l) ref NCh1038:2009.",simple:"El informe no es solo el número. Tienes que poner 12 cosas. Las que más se olvidan y donde te observan son e) y j). En e) no basta poner “sin defectos”, tienes que decir si usaste cuero (qué espesor, si era nuevo) o si refrentaste. En j) describe cómo se vio la rotura: “plano vertical, textura normal, sin huecos mayores a 5 mm, sin segregación”. Si viste que arriba quedó pura pasta y abajo puras piedras (segregación) y no lo pones, el auditor te puede invalidar todo el lote."},{kind:"block",techTitle:"5.2 Validez — árbol decisión",tech:"1) Tercio central → VÁLIDO R=PL/bh². 2) Fuera tercio pero ≤0,05L línea carga → VÁLIDO CON NOTA R=3Pa/bh² indicar a y distancia. 3) Fuera >0,05L → DESECHAR no promediar causa ej. “rotura a 60 mm de línea carga >0,05L=22,5 mm desecha 6.1.3”. Torsión evidente → desechar aunque tercio por falla rótulas.",simple:"Piensa así: se rompió en el tercio medio → perfecto. Se rompió un poquito fuera pero a menos de 22,5 mm de la carga (si L=450) → vale pero con asterisco y anotas dónde fue. Se rompió lejos → chao, no cuenta. Y si ves que la rotura salió torcida en diagonal, aunque sea en el medio, también se desecha porque la máquina estaba torciendo la probeta."}]},ov=[{id:1,cap:1,q:"¿Qué establece NCh1038:2009 según 1.1?",o:["Método para determinar resistencia a tracción por flexión a rotura de probetas prismáticas simplemente apoyadas","Método para compresión de cilindros NCh1037","Método para esclerometría","Método para tracción directa de prismas"],c:0,exp:"Cláusula 1.1 Alcance: establece procedimientos para determinar resistencia a tracción por flexión a rotura de probetas prismáticas simplemente apoyadas, confeccionadas según NCh1017. Anula Of1977. En simple: es la receta para romper una viguita apoyada en dos puntos y ver cuánta fuerza aguanta a flexión."},{id:2,cap:1,q:"¿Qué norma anula y reemplaza NCh1038:2009?",o:["NCh1038.Of1977","NCh1017.Of2009","NCh170.Of2016","NCh148.Of68"],c:0,exp:"Preámbulo: NCh1038:2009 anula y reemplaza a NCh1038.Of1977. La versión 2009 actualiza procedimientos y toma base ASTM C78-08. En simple: la del 77 quedó obsoleta, ahora usas la del 2009 que es más exigente en calibración y geometría."},{id:3,cap:1,q:"¿En qué norma ASTM se basa NCh1038:2009?",o:["ASTM C78-08 Standard Test Method for Flexural Strength (third-point loading)","ASTM C39 compresión cilindros","ASTM C136 granulometría","ASTM C143 cono Abrams"],c:0,exp:"Preámbulo: basada en ASTM C78-08 para carga en tercios. Usa mismo principio de momento constante en tercio central. En simple: copia la gringa que usa dos cargas arriba separadas L/3, para que el medio falle por su punto más débil."},{id:4,cap:1,q:"¿Por qué no se adoptó ISO 1920-4 como base directa?",o:["Por ser demasiado general para aplicación chilena y no detallar L, h y condiciones específicas","Por ser de tracción directa no flexión","Porque no existía en 2009","Por ser más cara"],c:0,exp:"Preámbulo: ISO 1920-4 se consideró demasiado general. No detalla rangos L mayor o igual que 3h / 2h, tolerancias ±1 mm, contacto ≤0,1 mm. NCh necesitaba precisión para pavimentos. En simple: ISO dice “haz flexión” muy genérico; Chile necesitó decir exactamente separación apoyos y cómo poner cuero."},{id:5,cap:1,q:"¿Para qué altura h se usa método carga en tercios P/2?",o:["h mayor o igual que 150 mm y L mayor o igual que 3h","h menor que 100 mm y L mayor o igual que 2h","h mayor o igual que 300 mm","Cualquier h"],c:0,exp:"Cláusula 1.3.1: h mayor o igual que 150 mm → L mayor o igual que 3h. Dos rodillos superiores separados L/3. Momento constante en tercio central, falla por defecto más débil del medio. En simple: probeta alta como ladrillo alto, necesitas apoyar lejos (3 veces su altura) y cargar en dos puntos arriba."},{id:6,cap:1,q:"¿Para qué altura h se usa método carga centrada P?",o:["h menor que 150 mm y L mayor o igual que 2h","h mayor o igual que 150 mm y L mayor o igual que 3h","h = 150 mm exacto","Cualquier h mayor o igual que 100 mm"],c:0,exp:"Cláusula 1.3.2: h menor que 150 mm → L mayor o igual que 2h. Un rodillo central. Momento máximo puntual al centro. En simple: probeta chiquita (100 mm) con una sola carga al medio, más fácil en laboratorio, pero solo vale si es bajita."},{id:7,cap:1,q:"¿Los dos métodos P/2 y P son alternativos y comparables entre sí?",o:["No, no son alternativos ni comparables según 1.3.3, no correlacionar","Sí, son intercambiables con factor 0,9","Sí, si h es igual da lo mismo","Sí, P da siempre lo mismo que P/2"],c:0,exp:"Cláusula 1.3.3: NO son alternativos ni comparables ni correlacionables. Diagrama momento diferente y volumen solicitado diferente. En simple: tercio pide todo el tercio medio con mismo momento, encuentra el punto débil fácil. Centrada solo pide un punto, es más difícil que caiga justo el defecto, por eso da 5-10% más alto."},{id:8,cap:1,q:"¿Por qué carga centrada suele dar resistencia 5-10% mayor que tercios?",o:["Porque solicita menor volumen bajo momento máximo (puntual vs constante) y menor probabilidad de defecto crítico","Porque la prensa es más grande","Porque usa rodillos planos","Porque se ensaya más rápido"],c:0,exp:"Fundamento mecánico: en tercios, todo tercio central está a momento máximo constante, cualquier defecto en ese tramo falla. En centrada solo la sección bajo carga puntual está al máximo. Estadísticamente da mayor R. Por eso 1.3.3 prohíbe comparar. En simple: si buscas el punto débil en 15 cm (tercio) es más fácil encontrarlo que en 1 cm (centrada)."},{id:9,cap:1,q:"¿Qué regula NCh1017 citada en campo de aplicación?",o:["Confección y curado de probetas prismáticas para flexión, sin curado R baja 10-20%","Calibración prensa NCh2598/1","Refrentado NCh1172","Áridos NCh163"],c:0,exp:"Referencia NCh1017: confección, llenado, compactación y curado. Si curado es deficiente o se seca cara inferior, baja R 10-20% por retracción. Auditor revisa curado. En simple: si no curaste bien, no es que hormigón sea malo, lo secaste tú."},{id:10,cap:1,q:"Probeta típica chilena 150×150×600 ¿cumple geometría?",o:["Sí, L=450 cumple L mayor o igual que 3h (3×150=450) dejando 75 mm totales = 2×37,5 mm mayor o igual que 2,5 cm","No, necesita L=300","No, necesita L=600","Solo si es carga centrada"],c:0,exp:"Cálculo: h=150 mayor o igual que 150 → requiere L mayor o igual que 3h=450. Largo 600 deja voladizo (600-450)/2=75mm? No, (600-450)=150 total, 75 mm por lado pero mínimo 25 mm, cumple sobrado. Usual se deja 25 mm por lado con 500 mm molde, con 600 sobra. En simple: 150 de alto pide 450 de luz, si tu molde es 600 te quedan 75 mm por lado, más que 2,5 cm, ok."},{id:11,cap:1,q:"Probeta 100×100×400 ¿qué método y L corresponde?",o:["P centrada L=300 cumple L mayor o igual que 2h (2×100=200) dejando 50 mm por lado mayor o igual que 2,5 cm","P/2 L=450","P/2 L=200","Cualquier L"],c:0,exp:"h=100 menor que 150 → P centrada. L mayor o igual que 2h=200, en práctica se usa 300 para estabilidad y dejar ≥2,5 cm (400-300=100 total, 50 mm por lado). En simple: probeta bajita usa una carga al medio y apoyos a 300 mm, molde 400 deja 50 mm por lado."},{id:12,cap:1,q:"Referencia NCh2598/1 ¿qué exige para prensa?",o:["Calibración ≤12 meses, exactitud ±1%, rango 10-90% según certificado","Calibración cada 5 años","Solo inspección visual","Calibración con huincha"],c:0,exp:"Cláusula 4.1 y 5.12: prensa debe tener certificado NCh2598/1 vigente ≤12 meses, exactitud ±1% en intervalo 10-90%, sensibilidad ≤1% Pmax, y permitir velocidad 0,86-1,21 MPa/min. Re-calibrar tras traslado. En simple: papel vigente, no gigante para probeta chica, y que marque fino."},{id:13,cap:2,q:"Requisito 4.1 rigidez de prensa ¿qué exige?",o:["Rígida, sin alterar distribución carga, retorno a cero sin juego en rótula","Flexible para amortiguar","Que vibre para compactar","Que pese menos de 100 kg"],c:0,exp:"4.1: máquina rígida que no altere distribución de carga, sensibilidad ≤1%, exactitud ±1%. Retorno a cero sin juego. Capacidad típica 100-300 kN. En simple: no puede ser chiclosa, si se deforma te tuerce la probeta y cambia R."},{id:14,cap:2,q:"Sensibilidad de prensa 4.1: menor división debe ser",o:["≤1% carga máxima esperada (ej. Pmax 30000 N → división ≤300 N)","≤5% Pmax","≤0,1% Pmax","≤10% Pmax"],c:0,exp:"Sensibilidad ≤1% Pmax esperada. Si esperas romper a 30 kN y tu prensa muestra de 500 en 500 N, división 500/30000=1,66% >1% no cumple, es muy gruesa. En simple: si tu regla mide de 5 cm en 5 cm no sirve para medir 30 cm fino."},{id:15,cap:2,q:"Exactitud de prensa en intervalo utilizable según certificado NCh2598/1",o:["±1%","±2%","±0,5%","±5%"],c:0,exp:"Exactitud ±1% en intervalo utilizable definido por certificado. No confundir con sensibilidad. Certificado dice desde qué carga es exacta. En simple: si dice 10-90%, abajo de 10% mide pésimo aunque marque."},{id:16,cap:2,q:"Rango utilizable típico según certificado NCh2598/1",o:["10-90% capacidad nominal, no usar bajo 10% porque error aumenta","0-100% siempre","20-80% obligatorio","0-50% solamente"],c:0,exp:"Rango típico 10-90% capacidad. Si prensa 3000 kN y rompes 30 kN estás al 1% fuera de rango, error enorme. Necesitas prensa 100-300 kN para probetas. En simple: no uses camión para pesar carta."},{id:17,cap:2,q:"Plazo máximo calibración prensa según 4.1 NCh2598/1",o:["≤12 meses y tras traslado o reparación","≤24 meses","≤6 meses solo si falla","Cada 5 años"],c:0,exp:"4.1 exige certificado NCh2598/1 vigente ≤12 meses. Además re-calibrar tras traslado, golpe, reparación. Auditor pide fecha. En simple: papel de hace 3 años no sirve, aunque máquina se vea bien."},{id:18,cap:2,q:"Velocidad de aumento de tensión fibra extrema 5.12",o:["0,86 a 1,21 MPa/min continua sin choques hasta rotura","0,25 ±0,05 MPa/s como compresión","2 a 4 MPa/min","Lo más rápido posible"],c:0,exp:"5.12 razón uniforme tal que velocidad aumento tensión fibra extrema 0,86-1,21 MPa/min. Para R=4 MPa debe romper 2-5 min. Si rompe en 10 s vas muy rápido, sobrevaloras por inercia. En simple: ni tortuga ni liebre, 1 MPa por minuto aprox."},{id:19,cap:2,q:"Superficie de contacto de rodillos según 4.2 debe ser",o:["Cilíndrica con contacto rectilíneo, cargas y reacciones verticales paralelas ⊥ L","Plana rugosa con contacto área","Puntual con esfera","Plana con goma gruesa"],c:0,exp:"4.2 elementos de contacto superficie cilíndrica → contacto rectilíneo (línea). Cargas y reacciones verticales, líneas paralelas y ⊥ L. Si es plana, concentras en punto. En simple: rodillo redondo toca en una línea, no en un punto, reparte carga."},{id:20,cap:2,q:"Función de rótulas en dispositivo flexión 4.2",o:["Permitir giro e inclinación ligera y evitar excentricidades y torsión parásita","Aumentar carga aplicada","Medir deformación","Fijar L"],c:0,exp:"4.2 al menos una rótula inferior y una superior deben poder girar e inclinarse ligeramente. Compensa falta de paralelismo probeta. Sin rótula induces torsión, rotura diagonal, desechar. En simple: bisagra que se acomoda si probeta está un poco chueca, para no torcerla."},{id:21,cap:2,q:"Longitud rodillo respecto a ancho b según 4.2",o:["≥ b (ej. b=150 mm → rodillo ≥160 mm para cubrir ancho completo)","≤ b"," = b/2","≥ 2b"],c:0,exp:"Rodillo longitud ≥ b para contacto total ancho. Si b=150 y rodillo 100, cargas solo parte, concentración y torsión. En simple: rodillo debe ser más largo que ancho probeta, si no queda volando."},{id:22,cap:2,q:"Diámetro típico rodillos cilíndricos 4.2",o:["25-40 mm para evitar aplastamiento y asegurar contacto lineal","10 mm","100 mm","5 mm"],c:0,exp:"Diámetro 25-40 mm recomendado. Muy delgado se hunde, muy grueso contacta casi plano. En simple: tamaño de plumón grueso, no aguja ni tubo."},{id:23,cap:2,q:"Regla para verificar rectitud caras según 4.3 debe ser",o:["Acero rectificada ≥500 mm, criterio no pasa luz bajo regla","Aluminio 300 mm","Plástica 200 mm","Madera"],c:0,exp:"4.3 regla rectificada acero ≥500 mm. Se apoya sobre cara, no debe pasar luz. Si pasa luz ≤0,1 mm OK, 0,1-0,4 mm cuero, >0,4 mm refrentar. En simple: regla de acero larga realmente recta, si ves luz abajo está chueca."},{id:24,cap:2,q:"Instrumento para medir b, h, L, a según 4.4 resolución",o:["Pie de metro / huincha con resolución 1 mm para ℓ, b, h, L, a y distancias ±1 mm","Resolución 5 mm basta","Resolución 0,01 mm obligatoria","Solo visual"],c:0,exp:"4.4 pie metro o huincha metálica resolución 1 mm. Mide ℓ ±1 mm promedio ambas caras, b y h 3 puntos ±1 mm promedio rotura, L ±1 mm, a ±1 mm. En simple: huincha de obra no sirve si mide de 5 en 5."},{id:25,cap:2,q:"Balanza para masa según 4.5 precisión y capacidad",o:["Capacidad ≥35 kg, precisión ≥0,1% masada ≈0,02 kg para 26 kg","Capacidad 5 kg basta","Precisión 1 kg","Sin requisito"],c:0,exp:"4.5 balanza ≥35 kg, precisión ≥0,1% masada. Ej: 26 kg ×0,1%=0,026 kg requerida, práctica ±0,02 kg. Para densidad V=bhℓ. En simple: debe notar 20 gramos en 26 kg, si no no detecta variación densidad."},{id:26,cap:2,q:"¿Qué ocurre si usas rodillos planos en vez de cilíndricos?",o:["Concentración tensiones en línea, baja R 15-30% e introduce torsión y rotura inválida","No pasa nada, es mejor","Aumenta R 20%","Solo cambia color probeta"],c:0,exp:"Contacto plano → contacto puntual real por rugosidad, concentración tensiones, fisura prematura, baja R 15-30% y genera torsión. Norma exige cilíndrico. En simple: si apoyas viga en filo plano chueco, se quiebra antes por esquina."},{id:27,cap:2,q:"Fijación de luz L con topes según 4.2 tolerancia",o:["Topes permiten fijar L con ±1 mm y mantener paralelismo ⊥ L","±5 mm","±10 mm","Sin tolerancia"],c:0,exp:"4.2 dispositivo debe tener fijación de L con topes que mantengan ±1 mm y paralelismo. Verificación con pie metro antes de precarga 3-6%. En simple: si L se mueve 5 mm ya cambias momento y R."},{id:28,cap:3,q:"Acondicionamiento 5.1: probeta tras curado debe",o:["Protegerse con arpillera húmeda y ensayar inmediato tras retirar protección, evitar secado cara inferior traccionada","Secarse 24h al aire libre","Sumergirse en aceite","Congelarse"],c:0,exp:"5.1 retirar del curado → proteger con arpillera húmeda → ensayar inmediato. Evitar secado cara inferior traccionada. Refrentado ≤3h antes. En simple: sacas de cámara húmeda y tapas con trapo mojado, no dejes al aire >5 min, cara de abajo si se seca se microfisura y baja hasta 25%."},{id:29,cap:3,q:"¿Por qué secado de cara inferior baja R hasta 25%?",o:["Genera tensiones por retracción y microfisuras en fibra extrema traccionada que falla primero","Aumenta resistencia por secado","No afecta, es mito","Solo afecta densidad"],c:0,exp:"Secado parcial cara traccionada genera retracción diferencial, tensiones internas de tracción + microfisuras. Al cargar se suman, rotura prematura. Por eso 5.1 exige arpillera húmeda. En simple: cara abajo seca se contrae sola y ya viene fisurada antes de ensayar."},{id:30,cap:3,q:"Para h mayor o igual que 150 mm, L debe ser",o:["L mayor o igual que 3h para asegurar falla por flexión no corte","L mayor o igual que 2h","L = h","L mayor o igual que 4h obligatorio"],c:0,exp:"Cláusula L mayor o igual que 3h si h mayor o igual que 150 mm. Si L muy corto, cortante domina, aparece falla por corte diagonal, ensayo inválido. En simple: viga corta y alta se corta como tijera, no se dobla. Necesitas separar apoyos 3 veces altura."},{id:31,cap:3,q:"Para h menor que 150 mm, L debe ser",o:["L mayor o igual que 2h suficiente para flexión en probetas bajas (ej. h=100 → L mayor o igual que 200, usual 300)","L mayor o igual que 3h siempre","L = h","L menor que h"],c:0,exp:"L mayor o igual que 2h si h menor que 150 mm. Para probetas bajas no necesitas tanto, con 2h ya predomina flexión. Práctica usa 300 para 100 mm para dejar voladizo ≥2,5 cm. En simple: probeta bajita con apoyos a 2 veces su altura ya dobla bien."},{id:32,cap:3,q:"Distancia apoyo-extremo mínima según 5.7",o:["Mayor o igual que 2,5 cm desde extremos para ambos métodos, evita desportillado","Mayor o igual que 1 cm","Mayor o igual que 5 cm","Mayor o igual que 10 cm"],c:0,exp:"5.7 distancia apoyo a extremo ≥2,5 cm. Si no, esquina se desportilla al cargar y rotura no es limpia flexión. Largo mínimo molde = L+50 mm (2×25 mm). En simple: alero de 2,5 cm por lado, como pestaña, si queda justo en borde se rompe esquina."},{id:33,cap:3,q:"Si L=450 mm ¿largo mínimo molde y voladizo?",o:["Largo mínimo 500 mm = L+50 mm, voladizo 25 mm por lado mayor o igual que 2,5 cm","Largo 450 mm justo, voladizo 0","Largo 475 mm, voladizo 12,5 mm","Largo 600 mm obligatorio"],c:0,exp:"Cálculo: voladizo mínimo 25 mm por lado → largo mínimo = L + 25+25 = L+50. L=450 → 500 mm. Con molde 500 queda 25 mm por lado justo. Con molde 600 queda 75 mm por lado sobrado. En simple: si apoyas en 450 necesitas probeta de al menos 500 para dejar 2,5 cm por lado."},{id:34,cap:3,q:"Trazado según 5.3 debe ser",o:["Rectas finas indelebles en 4 caras mayores marcando apoyos y cargas, no tallar ni reducir sección","Tallar profundo con cincel","Marcar solo una cara superior","Marcar con plumón grueso que penetre 2 mm"],c:0,exp:"5.3 trazado rectas finas indelebles en 4 caras mayores marcando ejes apoyos y líneas carga. No tallar para no crear entalla que inicia fisura. En simple: rayita fina con lápiz, no canal profundo."},{id:35,cap:3,q:"Masa M se registra con aproximación según 5.5",o:["±0,02 kg justo antes de ensayar, balanza tarada escurrida no seca","±0,1 kg","±1 kg","±0,001 kg obligatorio"],c:0,exp:"5.5 masa M kg ±0,02 kg justo antes. Para densidad ρ=M/V. Pesar tras trazar? No, pesar antes para no perder agua manipulando. En simple: pesar al sacarla húmeda escurrida, si esperas se seca y pesa menos."},{id:36,cap:3,q:"Largo ℓ se mide según 5.6 cómo",o:["Eje horizontal punto medio caras laterales Fig.3c ±1 mm promedio ambas caras laterales","Por cara superior solamente","Diagonal de esquina a esquina","Por cara inferior solamente"],c:0,exp:"5.6 largo ℓ eje horizontal punto medio caras laterales Fig.3c ±1 mm promedio ambas caras. No por cara superior que es irregular. En simple: mides por el costado al medio, ambos lados y promedias."},{id:37,cap:3,q:"Luz L y posiciones carga se verifican con tolerancia",o:["±1 mm con pie metro antes de precarga 3-6%","±5 mm","±0,1 mm","Sin tolerancia"],c:0,exp:"5.7-5.10 verificación distancias L y líneas carga ±1 mm durante precarga 3-6%. Si se mueve, reajustar. En simple: si L es 450 y mides 455 ya cambias momento 1%."},{id:38,cap:3,q:"Contacto total aceptable sin corrección según 5.8 es",o:["Desviación ≤0,1 mm = aceptable directo sin láminas, criterio no pasa luz fina","Desviación ≤0,5 mm OK","Desviación ≤1 mm OK","Cualquier desviación OK"],c:0,exp:"5.8 contacto total desviación ≤0,1 mm aceptable directo. Verificación con regla ≥500 mm: no pasa luz o pasa ≤0,1 mm (grosor hoja). En simple: si no ves luz bajo regla, está buena, si pasa una hoja fina es ≤0,1 mm OK."},{id:39,cap:3,q:"Si contacto entre 0,1 y 0,4 mm según 5.9 se usa",o:["Láminas cuero/sintético espesor ≥5 mm ancho ≥25 mm largo ≥b nuevas sin reutilizar aplastadas","Cartón corrugado","Papel diario","Yeso París"],c:0,exp:"5.9 si 0,1-0,4 mm → láminas cuero o sintético blando espesor ≥5 mm, ancho ≥25 mm, largo ≥b, nuevas. Se deforma y compensa irregularidad. No yeso. En simple: tirita de cuero blanda de 5 mm grosor, ancha 25 mm, tan larga como ancho probeta, nueva."},{id:40,cap:3,q:"Dimensiones mínimas lámina cuero según 5.9",o:["Espesor ≥5 mm, ancho ≥25 mm, largo ≥b (ancho probeta), nuevas","Espesor 1 mm","Ancho 10 mm","Largo b/2"],c:0,exp:"5.9 espesor ≥5 mm para deformar, ancho ≥25 mm para repartir, largo ≥b para cubrir. Nuevas, desechables si se aplastan. En simple: si usas cuero finito 1 mm no compensa, necesitas grueso que se aplaste."},{id:41,cap:3,q:"Si contacto >0,4 mm según 5.9 se debe",o:["Refrentar/rectificar según NCh1172, no usar cuero ni yeso","Usar doble cuero","Desechar probeta sin informar","Usar yeso para nivelar"],c:0,exp:"5.9 si >0,4 mm (grosor tarjeta) → refrentar/rectificar según NCh1172 ≤3h antes ensayo. No yeso (prohibido). Yeso crea capa débil. En simple: muy chueca, hay que maquinar cara plana en máquina."},{id:42,cap:3,q:"Precarga 3-6% según 5.10 para qué",o:["Verificar contactos 5.8 y distancias ±1 mm, acomodar rótulas como acomodar mesa coja","Romper probeta parcialmente","Calentar probeta","No sirve"],c:0,exp:"5.10 precarga 3-6% carga rotura estimada Pest para verificar contactos, rótulas libres y distancias ±1 mm no se movieron. Retirar tras verificar. En simple: apretoncito para acomodar, como cuando acomodas mesa coja antes de sentarte."},{id:43,cap:3,q:"5.11 Retirar manos y objetos ¿por qué?",o:["Seguridad y evitar amortiguación o interferencia que altere distribución carga y rotura","Para calentar manos","No importa, puedes dejar mano bajo probeta","Para enfriar probeta"],c:0,exp:"5.11 retirar manos, herramientas, apósitos tras precarga. Seguridad y no interferir. Mano bajo probeta amortigua y cambia R. En simple: suelta la probeta, no la sujetes al romper."},{id:44,cap:3,q:"Velocidad carga hasta rotura 5.12",o:["Carga continua sin choques a razón uniforme 0,86-1,21 MPa/min hasta rotura","Carga a golpes intermitentes","Carga lo más rápido posible","Carga en escalones 1 MPa cada 5 min"],c:0,exp:"5.12 carga continua sin choques a razón uniforme tal que velocidad aumento tensión fibra extrema 0,86-1,21 MPa/min. Sin sacudidas. En simple: apretar parejo, no a martillazos."},{id:45,cap:3,q:"Si R esperada 4,0 MPa ¿cuánto debe durar ensayo según velocidad?",o:["2 a 5 min aprox: 4/1,21=3,3 min mínimo, 4/0,86=4,6 min máximo","10 segundos","20 minutos","30 minutos"],c:0,exp:"Tiempo = R / velocidad. Para 4 MPa: 4/1,21=3,3 min rápido, 4/0,86=4,65 min lento → 2-5 min ventana. Si rompe en 10 s ibas muy rápido, sobrevaloras. Si demora 20 min muy lento, relajación. En simple: debe romper en 3-4 minutos, no instantáneo."},{id:46,cap:3,q:"Registro tras rotura 5.13 qué se anota y mide",o:["Pmax N/kN con unidad y conversión, medir b y h en sección rotura 3 puntos (extremos y medio) ±1 mm promedio","Solo Pmax","Solo b/h nominal","Solo tiempo"],c:0,exp:"5.13 registrar Pmax N/kN con unidad. Medir b ancho y h altura en sección rotura en 3 puntos (ambos extremos y centro) ±1 mm promedio. Usar trozo con rotura, no nominal. En simple: mides donde se rompió, no donde querías que se rompiera."},{id:47,cap:3,q:"Cara de llenado en plano vertical 5.8 ¿por qué?",o:["Cara de llenado es irregular, más porosa y menos resistente; si queda traccionada abajo baja R hasta 20%","Da igual cualquier cara","Es más bonita arriba","Por norma europea"],c:0,exp:"5.8 colocar con cara de llenado en plano vertical. Cara superior de llenado es rugosa, con lechada, menos resistente. Si queda abajo traccionada, falla prematura. En simple: cara fea de arriba no va abajo, va de lado."},{id:48,cap:4,q:"Fórmula R en tercio central 6.1.1",o:["R = P·L / b·h² [MPa = N/mm²] aprox 0,05 MPa","R = 3PL/2bh²","R = P/A (compresión)","R = PL/4bh²"],c:0,exp:"6.1.1 si rotura en tercio central → R=PL/bh². P N, L mm, b mm promedio rotura, h mm promedio rotura, h² domina error 4% si h varía 2 mm. Aprox 0,05 MPa. En simple: fuerza por luz dividido ancho por alto al cuadrado. Ej 30kN·450/(150·22500)=4,0 MPa."},{id:49,cap:4,q:"Fórmula R fuera tercio pero válida ≤0,05L 6.1.2",o:["R = 3·P·a / b·h² donde a = distancia rotura-apoyo más próximo cara inferior, válida si dist a línea carga ≤0,05L","Se desecha siempre","Se promedia igual con PL/bh²","R = P·L / b·h"],c:0,exp:"6.1.2 si rotura fuera tercio pero ≤0,05L de línea carga → válida con nota. R=3Pa/bh², a distancia rotura-apoyo más próximo. Tolerancia 0,05L. L=450 → 22,5 mm. En simple: se rompió un poquito fuera (menos de ancho dedo de la carga) vale pero con otra fórmula usando a."},{id:50,cap:4,q:"Criterio descarte 6.1.3 rotura >0,05L",o:["Se desecha según 6.1.3, no promediar, indicar causa ej. rotura a 60 mm de línea carga >0,05L=22,5 mm","Se calcula igual con PL/bh²","Se corrige con factor 0,9","Se promedia con otras"],c:0,exp:"6.1.3 si rotura >0,05L fuera de línea carga → desechar, no promediar. Indicar en informe causa y distancia. Torsión evidente también desechar aunque esté en tercio por falla rótulas. En simple: se rompió lejos, más de 5% de L fuera, chao, no cuenta."},{id:51,cap:4,q:"Tolerancia 0,05L con L=450 mm ¿cuánto es?",o:["22,5 mm (0,05×450) válida si distancia rotura-línea carga ≤22,5 mm","5 mm","45 mm","2,5 mm"],c:0,exp:"Cálculo: 0,05×L = 0,05×450=22,5 mm. Si línea carga está a 150 mm y rotura a 160 mm distancia 10 mm ≤22,5 válida con nota. Si rotura a 200 mm distancia 50 mm >22,5 desechar. En simple: 22,5 mm es ancho de dedo pulgar."},{id:52,cap:4,q:"Fórmula carga centrada 6.2",o:["R = 3·P·L / 2·b·h² aprox 0,05 MPa","R = P·L / b·h²","R = P·L / 4·b·h²","R = 2PL/bh²"],c:0,exp:"6.2 carga centrada: R=3PL/2bh². Lleva 3/2 vs tercio. Ej: P=18kN=18000 N L=300 b=100 h=100 → R=3*18000*300/(2*100*10000)=16200000/2000000=8,10 MPa. En simple: misma idea pero con 1,5 factor porque momento máximo es PL/4 vs PL/6."},{id:53,cap:4,q:"Conversión kgf a N crítica 6.1",o:["1 kgf = 9,80665 N, olvidar da R 10× menor (0,4 vs 4,0 MPa)","1 kgf = 1 N","1 kgf = 10,5 N","1 kgf = 100 N"],c:0,exp:"Error clásico: prensa en kgf, fórmula exige N. Convertir: N = kgf ×9,80665. Si usas kgf directo, R te da ~10 veces menor (4,0 → 0,408). Auditor detecta. En simple: si tu P era 3000 kgf son 29420 N no 3000."},{id:54,cap:4,q:"Conversión kN a N",o:["1 kN = 1000 N","1 kN = 100 N","1 kN = 9,8 N","1 kN = 10,197 N"],c:0,exp:"1 kN=1000 N. Ej: 30 kN=30000 N. Si prensa da kN, multiplica ×1000. No confundir con kgf. En simple: kN a N son 3 ceros."},{id:55,cap:4,q:"Aproximación R según 6.1 y 6.2",o:["0,05 MPa (ej. 4,03 → 4,05 MPa)","0,01 MPa","0,1 MPa","1 MPa"],c:0,exp:"6.1 y 6.2 aproximar R a 0,05 MPa. Redondeo: R_rounded = round(R/0,05)*0,05. Ej 4,03→4,05. En simple: redondeas a 5 centésimas."},{id:56,cap:4,q:"Aproximación densidad 6.3",o:["10 kg/m³ (ej. 2347 → 2350 kg/m³)","1 kg/m³","100 kg/m³","0,1 kg/m³"],c:0,exp:"6.3 densidad ρ=M/V kg/m³ aprox 10 kg/m³. Ej V=150×150×500=11.250.000 mm³=0,01125 m³ M=26,4 kg → 2346,7 →2350. En simple: redondeas a decena."},{id:57,cap:4,q:"Volumen para densidad V según 6.3",o:["V = b·h·ℓ con b,h promedio rotura 3 puntos y ℓ promedio caras laterales Fig.3c","V = b·h nominal de molde","V = π·d²/4·ℓ cilindro","V = b·ℓ solamente"],c:0,exp:"6.3 V=b·h·ℓ mm³ donde b,h promedio rotura 3 puntos, ℓ largo promedio caras laterales ±1 mm. No nominal. Si usas nominal 150 en vez de 148 real, error 1,3% en V y densidad. En simple: volumen real donde se rompió, no del molde."},{id:58,cap:4,q:"Conversión volumen mm³ a m³",o:["Dividir por 1e9 (1.000.000.000) → V m³ = V mm³ /1e9","Dividir por 1000","Multiplicar por 1000","Dividir por 1e6"],c:0,exp:"1 m =1000 mm → 1 m³=1e9 mm³. Ej 11.250.000 mm³ /1e9 =0,01125 m³. Si divides por 1000 te da 11250 m³ absurdo. En simple: mm³ a m³ son 9 ceros."},{id:59,cap:4,q:"Densidad ρ fórmula",o:["ρ = M / V kg/m³ con M ±0,02 kg y V en m³","ρ = M·V","ρ = V / M","ρ = M + V"],c:0,exp:"ρ=M/V. M masa ±0,02 kg justo antes, V en m³. Ej 26,4/0,01125=2347 kg/m³ →2350. Si M en kg y V en mm³ directo da 0,000002, error. En simple: masa dividido volumen."},{id:60,cap:4,q:"Ejercicio 30 kN L=450 b=150 h=150 ¿R?",o:["4,0 MPa: R=30000×450/(150×150²)=13.500.000/3.375.000=4,0 MPa → 4,00 MPa aprox 0,05","0,4 MPa","40 MPa","0,04 MPa"],c:0,exp:"Cálculo paso a paso: P=30kN=30000 N, L=450, b=150, h=150 h²=22500, b·h²=150×22500=3.375.000, P·L=13.500.000, R=4,0 MPa. Si P en kgf 3059 kgf×9,80665=30000 N. Olvidar conversión da 0,408 MPa 10× menor. MPa→kgf/cm² ×10,197 → 40,79 kgf/cm². En simple: 30 kN en viga 15×15 luz 45 da 4 MPa típico pavimento."},{id:61,cap:4,q:"Ejercicio 2800 kgf pos 310 mm L=450 b=150 h=150 a=140 ¿R y validez?",o:["≈3,42 MPa válido con nota: a=140 mm, dist a línea 300 es 10 mm ≤0,05L=22,5 mm, R=3Pa/bh²; didáctico 30 kN a=140 →3,73 MPa","4,07 MPa exacto con 2800 kgf sin nota","0,34 MPa","Se desecha siempre"],c:0,exp:"Conversión 2800 kgf×9,80665=27458 N. L=450 tercio 150-300. Rotura 310 dist a línea 300=10 mm ≤22,5 válida con nota 6.1.2. a=dist rotura-apoyo más próximo=450-310=140 mm. R=3×27458×140/(150×22500)=11.532.780/3.375.000≈3,42 MPa. Didáctico con 30kN=30000 N →3,73 MPa. Si quieres 4,07 necesitas ~3350 kgf. En simple: 2800 kgf es 27,5 kN, con a=140 da 3,42 válido con asterisco."},{id:62,cap:4,q:"Ejercicio 18 kN centrada L=300 b=100 h=100 ¿R?",o:["8,10 MPa: R=3×18000×300/(2×100×10000)=16.200.000/2.000.000=8,10 MPa","0,81 MPa","81 MPa","4,05 MPa"],c:0,exp:"6.2 centrada: P=18kN=18000 N L=300 b=100 h=100 h²=10000. R=3PL/2bh²=3×18000×300/(2×100×10000)=16.200.000/2.000.000=8,10 MPa. Típico probeta delgada alta resistencia. Si usaras fórmula tercio PL/bh² daría 5,40 MPa erróneo. En simple: 18 kN al medio en viguita 10×10 luz 30 da 8,1 MPa."},{id:63,cap:5,q:"¿Cuántos antecedentes por probeta exige 7.2?",o:["12 antecedentes a-l completos","8 antecedentes","10 antecedentes","6 antecedentes"],c:0,exp:"7.2 lista a-l 12 ítems: a) fecha/edad, b) densidad M/V, c) b promedio rotura, d) h promedio rotura, e) defectos+refrentado/láminas, f) L, g) curado, h) Pmax N/kN unidad+conversión, i) R MPa fórmula usada aprox 0,05, j) observaciones post-rotura, k) desviaciones, l) ref NCh1038:2009. En simple: informe no es solo número, son 12 cosas."},{id:64,cap:5,q:"Item 7.2 e) defectos ¿qué debe contener?",o:["Defectos exteriores + si hubo refrentado NCh1172 o láminas cuero tipo/espesor/estado nuevo, crítico auditoría","Solo decir sin defectos","Solo fecha","Solo color"],c:0,exp:"e) defectos exteriores + refrentado NCh1172 o láminas cuero tipo/espesor/estado — crítico. No basta sin defectos, debes decir usaste cuero 5 mm espesor ≥25 mm ancho nuevo o refrentaste. Auditor revisa. En simple: si usaste cuero di qué cuero y si era nuevo."},{id:65,cap:5,q:"Item 7.2 j) observaciones post-rotura ¿qué describir?",o:["Oquedades, porosidad, adherencia árido-pasta, segregación, rotura defectuosa, textura plano vertical, crítico auditoría","Solo R","Solo fecha","Solo L"],c:0,exp:"j) observaciones post-rotura: oquedades >5 mm, porosidad, adherencia, segregación (pasta arriba árido abajo), rotura defectuosa diagonal. Crítico. Si viste segregación y no informas, lote puede invalidarse. En simple: describe cómo se vio la rotura: plano vertical, textura normal, sin huecos grandes."},{id:66,cap:5,q:"Referencia obligatoria final 7.2 l)",o:["NCh1038:2009 referencia obligatoria","NCh1017 solamente","ASTM C78 solamente","Ninguna"],c:0,exp:"7.2 l) referencia NCh1038:2009 obligatoria. Además indicar desviaciones k) si hubo. En simple: al final poner Ensayo según NCh1038:2009."},{id:67,cap:5,q:"Item 7.2 h) Pmax ¿cómo se informa?",o:["Pmax en N o kN con unidad y conversión si prensa en kgf (×9,80665) o kN (×1000) explícita","Solo en kgf sin conversión","Solo número sin unidad","Solo en MPa"],c:0,exp:"h) Pmax N/kN con unidad y conversión. Si prensa marca kgf, indicar P kgf y P N convertida. Ej 2800 kgf =27458 N. Si no, auditor detecta R 10× menor. En simple: pon 2800 kgf (27458 N)."},{id:68,cap:5,q:"Item 7.2 b) densidad ¿cómo se calcula e informa?",o:["Densidad M/V kg/m³ con M ±0,02 kg y V=b·h·ℓ mm³/1e9 aprox 10 kg/m³","Solo masa","Solo volumen","Densidad sin fórmula"],c:0,exp:"b) densidad M/V. V=b·h·ℓ con b,h promedio rotura, ℓ promedio caras laterales. V m³=V mm³/1e9. ρ=M/V aprox 10 kg/m³. Ej 26,4 kg /0,01125 m³=2350 kg/m³. En simple: masa dividido volumen en m³."},{id:69,cap:5,q:"Árbol decisión validez rotura según 6.1",o:["Tercio central → VÁLIDO R=PL/bh²; Fuera tercio ≤0,05L línea carga → VÁLIDO CON NOTA R=3Pa/bh² indicar a; >0,05L → DESECHAR no promediar","Todo válido siempre","Todo se desecha","Solo tercio válido, fuera nunca vale"],c:0,exp:"Validez: 1) Tercio central → VÁLIDO PL/bh². 2) Fuera ≤0,05L → VÁLIDO CON NOTA 3Pa/bh² indicar a y distancia a línea. 3) >0,05L → DESECHAR causa ej. rotura a 60 mm de línea >22,5 mm desecha 6.1.3. Torsión evidente desechar aunque tercio por falla rótulas. En simple: medio perfecto, cerquita con asterisco, lejos chao."},{id:70,cap:5,q:"Torsión evidente durante ensayo ¿qué hacer aunque rotura esté en tercio?",o:["Desechar probeta por falla rótulas, aunque esté en tercio central, indicar en j) rotura defectuosa por torsión","Igual válida","Corregir con factor 0,9","Promediar igual"],c:0,exp:"Si rotura sale diagonal o con torsión evidente, desechar aunque esté en tercio, indica falla rótulas no libres o contacto irregular. Registrar en j) rotura defectuosa por torsión parásita. Revisar rótulas libres. En simple: si rotura sale torcida en diagonal, máquina estaba torciendo probeta, no vale."}],Gn=[{id:1,cap:1,front:"Alcance NCh1038",back:"Tracción por flexión rotura prismas simplemente apoyados. Anula Of77. Base ASTM C78-08."},{id:2,cap:1,front:"¿Cuándo P/2 tercios vs P centrada?",back:"P/2 si h mayor o igual que 150 mm y L mayor o igual que 3h. P si h menor que 150 mm y L mayor o igual que 2h. No comparables."},{id:3,cap:1,front:"Tip probeta típica pavimento",back:"150×150×600 → L=450 tercio central. 100×100×400 → L=300 centrada."},{id:4,cap:2,front:"Prensa: sensibilidad y exactitud",back:"Sens ≤1% Pmax, exactitud ±1%, rango 10-90%, certif ≤12 meses."},{id:5,cap:2,front:"Dispositivo flexión: contacto",back:"Superficie cilíndrica contacto rectilíneo, líneas verticales paralelas ⊥ L, rodillo ≥ b."},{id:6,cap:2,front:"Falla usar rodillos planos",back:"Concentración tensiones, baja R 15-30%, introduce torsión."},{id:7,cap:2,front:"Instrumentos 4.3-4.5",back:"Regla acero ≥500 mm, pie metro mm, balanza ≥35 kg ±0,1% ~0,02 kg."},{id:8,cap:3,front:"Acondicionamiento 5.1",back:"Retirar curado → arpillera húmeda → ensayar inmediato. Evitar secado cara inferior."},{id:9,cap:3,front:"Geometría L y extremos",back:"L mayor o igual que 3h si h mayor o igual que 150 mm, L mayor o igual que 2h si h menor que 150 mm, ≥2,5 cm desde extremos."},{id:10,cap:3,front:"Trazado 5.3-5.6",back:"Rectas finas 4 caras, verificar rectitud no pasa luz, masa ±0,02 kg, ℓ ±1 mm."},{id:11,cap:3,front:"Contacto: límites",back:"≤0,1 mm OK, 0,1-0,4 mm cuero ≥5 mm esp ≥25 mm ancho ≥ b largo, >0,4 mm refrentar."},{id:12,cap:3,front:"Precarga 3-6%",back:"Apretoncito para acomodar, verificar contactos y distancias ±1 mm."},{id:13,cap:3,front:"Velocidad normativa",back:"0,86-1,21 MPa/min sin choques hasta rotura. Si 4 MPa debe romper 2-5 min."},{id:14,cap:4,front:"R tercio central",back:"R= P·L / b·h². Ej: 30kN·450/(150·22500)=4,0 MPa."},{id:15,cap:4,front:"R fuera tercio pero válida",back:"Si ≤0,05L: R=3·P·a / b·h². a distancia rotura-apoyo más próximo."},{id:16,cap:4,front:"Criterio descarte 6.1.3",back:"Si >0,05L fuera línea carga → desechar. L=450 → 0,05L=22,5 mm."},{id:17,cap:4,front:"R carga centrada",back:"R=3·P·L / 2·b·h²."},{id:18,cap:4,front:"Densidad",back:"V=b·h·ℓ, V m³=V mm³/1e9, ρ=M/V kg/m³ aprox 10."},{id:19,cap:4,front:"Trampas conversión",back:"kgf→N 9,80665, olvidar da R 10× menor. Usar b,h rotura no
